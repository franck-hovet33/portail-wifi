
name: Compilation APK Portail Wi-Fi

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      - name: Decompresser le projet
        run: |
          mkdir projet
          unzip Portail-WiFi-GitHub-Actions.zip -d projet

      - name: Compiler application
        run: |
          cd projet
          gradle --no-daemon :app:assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Portail-WiFi-APK
          path: projet/app/build/outputs/apk/debug/app-debug.apk
