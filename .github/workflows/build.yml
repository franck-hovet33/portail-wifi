
name: Compilation APK Portail Wi-Fi

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  compilation:
    runs-on: ubuntu-latest

    steps:

      # Recuperation du depot GitHub
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      # Java 17 pour les outils Android
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installation du SDK Android
      - name: Installer Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Installation des composants Android necessaires
      - name: Installer les composants Android
        run: |
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3"

      # Java 8 pour l'ancien systeme Gradle du projet
      - name: Installer Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      # Installation de Gradle compatible avec le projet
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      # Recherche et extraction du ZIP
      - name: Decompresser le projet
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP trouve dans le depot."
            exit 1
          fi

          mkdir -p projet
          unzip -o "$ZIP_FILE" -d projet

          test -f projet/settings.gradle
          test -f projet/app/build.gradle

      # Compilation de l'application Android
      - name: Compiler application
        run: |
          gradle --no-daemon --stacktrace -p projet :app:assembleDebug

      # Mise a disposition du fichier APK
      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Portail-WiFi-APK
          path: projet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
