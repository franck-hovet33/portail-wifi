
name: Compilation APK Portail Wi-Fi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  compilation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4

      # Java 17 est necessaire pour installer le SDK Android
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android
        uses: android-actions/setup-android@v3

      - name: Installer les outils Android
        run: |
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"

      # Java 8 est utilise pour compiler l'ancien projet Android
      - name: Installer Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Installer Gradle 5.6.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '5.6.4'

      - name: Decompresser le projet
        run: |
          mkdir -p projet
          unzip -o Portail-WiFi-GitHub-Actions.zip -d projet
          test -f projet/app/build.gradle

      - name: Compiler application
        run: |
          gradle --no-daemon --stacktrace -p projet :app:assembleDebug

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: Portail-WiFi-APK
          path: projet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
